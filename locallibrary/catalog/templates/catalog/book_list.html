{% extends "base_generic.html" %}

{% block title %}
    <title>Books | Local Library</title>
{% endblock %}

{% block content %}
  <h1>Book List</h1>
  {% if books %}
    <ul>
      {% for book in books %}
      <li>
        <a href="{{ book.get_absolute_url }}">{{ book.title }}</a>
        <a href="{{ book.author.get_absolute_url }}">{{ book.author }}</a>
      </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no books in the library.</p>
  {% endif %}
{% endblock %}
